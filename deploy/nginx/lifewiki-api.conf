# LifeWiki Strapi reverse proxy (HTTP only — certbot adds the 443 block)
# Place in /etc/nginx/sites-available/ and symlink to /etc/nginx/sites-enabled/
# The setup script writes this with your real API domain; certbot then upgrades it to HTTPS.

server {
    listen 80;
    server_name __API_DOMAIN__;

    # Strapi admin panel + REST API
    location / {
        proxy_pass http://127.0.0.1:1338;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
